services:
  - type: web
    name: hitfit-tribe-admin
    runtime: node
    plan: free
    buildCommand: echo "No build step"
    startCommand: node server.js
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: spoortifitanalyze/Hitfit-Tribe
      - key: GITHUB_BRANCH
        value: main
      - key: ALLOWED_ORIGINS
        value: https://spoortifitanalyze.github.io,https://hitfit.in,https://www.hitfit.in
      - key: CONTACT_TO_EMAIL
        value: hitendra2309@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: hitendra2309@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: hitendra2309@gmail.com
